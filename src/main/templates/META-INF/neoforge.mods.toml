modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/RimaksX/TechnoGenesis/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Контур"
authors="TechnoGenesis"
description='''
Контур - промышленная металлургия: от дробилки до плазменного реактора.
Чем глубже переработка руды, тем больше металла, и тем дороже оборудование, энергия и реагенты.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version_range}"
    ordering="NONE"
    side="CLIENT"
