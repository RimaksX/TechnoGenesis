name: Build

on:
  push:
    branches: ["claude/zealous-cannon-l15u8v"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: kontur-jar
          path: build/libs/kontur-*.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" build/libs/kontur-*.jar \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Контур ${VERSION} (сборка ${{ github.run_number }})" \
            --notes "Автоматическая сборка. Положите jar в папку mods клиента NeoForge 1.21.1 (21.1.x). JEI необязателен."
